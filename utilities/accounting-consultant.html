<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PNL Evolution - Consulente contabile</title>
    <link rel="stylesheet" href="/assets/styles/brand.css">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--brand-surface);
            color: var(--brand-ink);
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            line-height: 1.55;
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            padding: 10px 28px;
            background: #fff;
            border-bottom: 1px solid var(--brand-border);
            position: sticky;
            top: 0;
            z-index: 20;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            color: var(--brand-ink);
            text-decoration: none;
        }
        .brand img { width: 126px; height: auto; }
        .brand-title {
            display: block;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .brand-subtitle { color: var(--brand-muted); font-size: 13px; }
        .nav { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: flex-end; }
        .nav a { color: #0b5870; font-weight: 700; text-decoration: none; }
        .nav a.active {
            color: var(--brand-pnl-green-dark);
            background: var(--brand-pnl-green-soft);
            border-radius: 999px;
            padding: 8px 14px;
        }
        .container {
            width: min(1480px, calc(100% - 48px));
            margin: 0 auto;
            padding: 24px 0 42px;
        }
        .hero {
            background: linear-gradient(135deg, var(--brand-pnl-blue) 0%, #006d75 55%, var(--brand-pnl-green) 100%);
            color: #fff;
            border-radius: 20px;
            padding: 34px;
            margin-bottom: 24px;
            box-shadow: 0 18px 38px rgba(16, 42, 67, 0.12);
        }
        .hero h1 { margin: 0 0 8px; font-size: clamp(34px, 5vw, 56px); }
        .hero p { margin: 0; max-width: 940px; font-size: 18px; }
        .panel {
            background: #fff;
            border: 1px solid var(--brand-border);
            border-radius: 18px;
            box-shadow: 0 14px 30px rgba(16, 42, 67, 0.08);
            padding: 24px;
            margin-bottom: 18px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 220px 1fr auto;
            gap: 16px;
            align-items: end;
        }
        label {
            display: block;
            color: #4d5d6c;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        select, input[type="file"] {
            width: 100%;
            border: 1px solid var(--brand-border);
            border-radius: 15px;
            padding: 13px 14px;
            background: #f8fbfd;
            color: var(--brand-ink);
            font: inherit;
        }
        button {
            appearance: none;
            border: 0;
            border-radius: 16px;
            background: var(--brand-pnl-blue);
            color: #fff;
            cursor: pointer;
            font-weight: 900;
            padding: 14px 22px;
            font-size: 15px;
        }
        button.secondary {
            background: #eaf4fb;
            color: var(--brand-pnl-blue);
            border: 1px solid var(--brand-border);
        }
        button:disabled { opacity: 0.55; cursor: wait; }
        .message { margin-top: 14px; font-weight: 900; }
        .message.ok { color: #087c3f; }
        .message.error { color: #b42318; }
        .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
        .stat {
            border: 1px solid var(--brand-border);
            border-radius: 999px;
            padding: 10px 14px;
            background: #f8fbfd;
            font-weight: 900;
        }
        .table-wrap { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1180px;
        }
        th, td {
            border-bottom: 1px solid var(--brand-border);
            padding: 13px 12px;
            text-align: left;
            vertical-align: top;
        }
        th {
            color: #4d5d6c;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .description { max-width: 520px; }
        .badge {
            display: inline-flex;
            border-radius: 999px;
            padding: 7px 11px;
            font-weight: 900;
            font-size: 12px;
            white-space: nowrap;
        }
        .badge-code_hint, .badge-feedback_override, .badge-feedback_override_amount {
            background: #e3f6ea;
            color: #087c3f;
        }
        .badge-review, .badge-code_hint_unknown {
            background: #ffe6ec;
            color: #b42318;
        }
        .muted { color: #4d5d6c; font-size: 13px; }
        .feedback-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .feedback-row select { width: min(360px, 100%); }
        @media (max-width: 900px) {
            .container { width: min(100% - 24px, 1480px); }
            .topbar { align-items: flex-start; flex-direction: column; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/utilities">
            <img src="/assets/brand/logo_pnl_evolution.png" alt="PNL Evolution">
            <span>
                <strong class="brand-title">Rebekko Webapps</strong>
                <span class="brand-subtitle">PNL Evolution</span>
            </span>
        </a>
        <nav class="nav">
            <a href="/">Home</a>
            <a href="/utilities">Utilities</a>
            <a class="active" href="/utilities/accounting-consultant">Consulente contabile</a>
        </nav>
    </header>

    <main class="container">
        <section class="hero">
            <h1>Consulente contabile</h1>
            <p>Primo MVP isolato: legge un CSV bancario, applica code hint e feedback esatti persistiti. Il modello ML verra' aggiunto dopo questa base.</p>
        </section>

        <section class="panel">
            <div class="form-grid">
                <div>
                    <label for="bank">Banca</label>
                    <select id="bank">
                        <option value="postfinance">PostFinance</option>
                        <option value="raiffeisen">Raiffeisen</option>
                    </select>
                </div>
                <div>
                    <label for="fileInput">CSV bancario</label>
                    <input id="fileInput" type="file" accept=".csv,text/csv">
                </div>
                <button id="parseButton" type="button">Leggi e predici</button>
            </div>
            <div id="message" class="message"></div>
        </section>

        <section id="resultsPanel" class="panel" hidden>
            <div id="stats" class="stats"></div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Descrizione</th>
                            <th>Importo</th>
                            <th>Predizione</th>
                            <th>Correzione</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const bank = document.getElementById("bank");
        const fileInput = document.getElementById("fileInput");
        const parseButton = document.getElementById("parseButton");
        const message = document.getElementById("message");
        const resultsPanel = document.getElementById("resultsPanel");
        const resultsBody = document.getElementById("resultsBody");
        const stats = document.getElementById("stats");
        let accounts = [];
        let currentRows = [];

        function escapeHtml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function accountOptions(selected) {
            return [
                '<option value="">Scegli conto...</option>',
                ...accounts.map(account => {
                    const value = escapeHtml(account.code);
                    const label = escapeHtml(`${account.code} - ${account.description}`);
                    return `<option value="${value}" ${account.code === selected ? "selected" : ""}>${label}</option>`;
                })
            ].join("");
        }

        async function loadAccounts() {
            const response = await fetch("/api/utilities/accounting/accounts");
            const payload = await response.json();
            if (!response.ok) throw new Error(payload.detail || "Caricamento conti fallito.");
            accounts = payload.accounts || [];
        }

        function renderStats(payload) {
            stats.innerHTML = `
                <span class="stat">Righe ${payload.count}</span>
                <span class="stat">Da revisionare ${payload.review_count}</span>
                <span class="stat">Conti caricati ${accounts.length}</span>
            `;
        }

        function renderPrediction(row) {
            const prediction = row.prediction || {};
            const source = prediction.source || "review";
            const account = prediction.account_code
                ? `<strong>${escapeHtml(prediction.account_code)}</strong><div class="muted">${escapeHtml(prediction.account_description || "")}</div>`
                : `<strong>Da revisionare</strong><div class="muted">${escapeHtml(prediction.message || "")}</div>`;
            return `
                <span class="badge badge-${escapeHtml(source)}">${escapeHtml(source)}</span>
                <div>${account}</div>
            `;
        }

        function renderRows(payload) {
            currentRows = payload.transactions || [];
            renderStats(payload);
            resultsBody.innerHTML = currentRows.map((row, index) => `
                <tr>
                    <td>${escapeHtml(row.date)}</td>
                    <td class="description">${escapeHtml(row.description)}</td>
                    <td><strong>${escapeHtml(row.amount)}</strong></td>
                    <td>${renderPrediction(row)}</td>
                    <td>
                        <div class="feedback-row">
                            <select data-index="${index}">${accountOptions(row.prediction?.account_code)}</select>
                            <button class="secondary" type="button" data-feedback="${index}" data-amount="true">Salva con importo</button>
                            <button class="secondary" type="button" data-feedback="${index}" data-amount="false">Salva solo testo</button>
                        </div>
                    </td>
                </tr>
            `).join("");
            resultsPanel.hidden = false;
        }

        async function parseAndPredict() {
            message.textContent = "";
            message.className = "message";
            if (!fileInput.files[0]) {
                message.textContent = "Carica un CSV.";
                message.classList.add("error");
                return;
            }
            parseButton.disabled = true;
            message.textContent = "Elaborazione...";
            try {
                if (!accounts.length) await loadAccounts();
                const formData = new FormData();
                formData.append("file", fileInput.files[0]);
                formData.append("bank", bank.value);
                const response = await fetch("/api/utilities/accounting/bank/parse-predict", {
                    method: "POST",
                    body: formData,
                });
                const payload = await response.json();
                if (!response.ok) throw new Error(payload.detail || "Elaborazione fallita.");
                renderRows(payload);
                message.textContent = "Elaborazione completata.";
                message.classList.add("ok");
            } catch (error) {
                message.textContent = error.message || String(error);
                message.classList.add("error");
            } finally {
                parseButton.disabled = false;
            }
        }

        async function saveFeedback(index, includeAmount) {
            const row = currentRows[index];
            const select = document.querySelector(`select[data-index="${index}"]`);
            const accountCode = select?.value || "";
            if (!row || !accountCode) {
                alert("Scegli un conto.");
                return;
            }
            const response = await fetch("/api/utilities/accounting/feedback", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    raw_text: row.description,
                    amount: includeAmount ? row.amount : null,
                    account_code: accountCode,
                    predicted_account_code: row.prediction?.account_code || null,
                    prediction_source: row.prediction?.source || null,
                }),
            });
            const payload = await response.json();
            if (!response.ok) {
                alert(payload.detail || "Salvataggio feedback fallito.");
                return;
            }
            alert(includeAmount ? "Feedback salvato con importo." : "Feedback salvato solo sul testo.");
        }

        parseButton.addEventListener("click", parseAndPredict);
        resultsBody.addEventListener("click", event => {
            const button = event.target.closest("button[data-feedback]");
            if (!button) return;
            saveFeedback(Number(button.dataset.feedback), button.dataset.amount === "true");
        });

        loadAccounts().catch(error => {
            message.textContent = error.message || String(error);
            message.classList.add("error");
        });
    </script>
</body>
</html>
