<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anteprima Corso - PNL Evolution</title>
    <link rel="stylesheet" href="/utilities/static/lesson-plan/css/print-styles.css">
    <style>
        /* Additional styles for course preview */
        .lesson-plan-page {
            page-break-after: always;
        }

        .lesson-plan-page:last-child {
            page-break-after: auto;
        }

        .course-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid var(--primary-blue, #1e56a0);
        }

        .course-title {
            font-size: 24px;
            color: var(--primary-blue, #1e56a0);
            margin-bottom: 10px;
        }

        .course-summary {
            font-size: 14px;
            color: #666;
        }

        .lesson-number {
            background: var(--primary-blue, #1e56a0);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="print-controls no-print">
        <button onclick="window.print()" class="btn btn-primary">🖨️ Stampa PDF Corso</button>
        <button onclick="window.close()" class="btn btn-secondary">← Torna al Form</button>
    </div>

    <!-- All course content generated by JavaScript -->
    <div id="courseContent">
        <!-- Course pages will be populated here by generateCoursePagesArray() -->
    </div>

    <!-- Core utilities - required for date formatting and localStorage -->
    <script src="/utilities/static/lesson-plan/js/time-utils.js"></script>

    <!-- Rendering engine - SINGLE SOURCE OF TRUTH for course pages -->
    <script src="/utilities/static/lesson-plan/js/lesson-plan-renderer.js"></script>

    <!-- Page controller - uses generateCoursePagesArray() -->
    <script src="/utilities/static/lesson-plan/js/course-preview.js"></script>
</body>
</html>
