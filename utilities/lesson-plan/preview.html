<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anteprima Piano Lezione - PNL Evolution</title>
    <link rel="stylesheet" href="/utilities/static/lesson-plan/css/print-styles.css">
</head>
<body>
    <div class="print-controls no-print">
        <button onclick="window.print()" class="btn btn-primary">🖨️ Stampa PDF</button>
        <button onclick="window.close()" class="btn btn-secondary">← Torna al Form</button>
    </div>

    <!-- All lesson plan content generated by JavaScript -->
    <div id="previewContent">
        <!-- Lesson plan page will be populated here by createLessonPlanPageHTML() -->
    </div>

    <!-- Core utilities - required for date/time formatting and localStorage -->
    <script src="/utilities/static/lesson-plan/js/time-utils.js"></script>

    <!-- Rendering engine - SINGLE SOURCE OF TRUTH for lesson plan pages -->
    <script src="/utilities/static/lesson-plan/js/lesson-plan-renderer.js"></script>

    <!-- Page controller - uses createLessonPlanPageHTML() -->
    <script src="/utilities/static/lesson-plan/js/preview.js"></script>
</body>
</html>
