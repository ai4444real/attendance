<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PNL Evolution - Smallinvoice</title>
    <link rel="stylesheet" href="/assets/styles/brand.css">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--brand-surface);
            color: var(--brand-ink);
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            line-height: 1.55;
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            padding: 10px 28px;
            background: #fff;
            border-bottom: 1px solid var(--brand-border);
            position: sticky;
            top: 0;
            z-index: 20;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            color: var(--brand-ink);
            text-decoration: none;
        }
        .brand img { width: 126px; height: auto; }
        .brand-title {
            display: block;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .brand-subtitle {
            color: var(--brand-muted);
            font-size: 13px;
        }
        .nav {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .nav a {
            color: #0b5870;
            font-weight: 700;
            text-decoration: none;
        }
        .nav a.active {
            color: var(--brand-pnl-green-dark);
            background: var(--brand-pnl-green-soft);
            border-radius: 999px;
            padding: 8px 14px;
        }
        .container {
            width: min(1320px, calc(100% - 48px));
            margin: 0 auto;
            padding: 24px 0 42px;
        }
        .hero {
            background: linear-gradient(135deg, var(--brand-pnl-blue) 0%, #006d75 55%, var(--brand-pnl-green) 100%);
            color: #fff;
            border-radius: 20px;
            padding: 36px 34px;
            margin-bottom: 24px;
            box-shadow: 0 18px 38px rgba(16, 42, 67, 0.12);
        }
        .hero h1 {
            margin: 0 0 8px;
            font-size: clamp(34px, 4vw, 56px);
            letter-spacing: -0.04em;
        }
        .hero p {
            margin: 0;
            max-width: 820px;
            font-size: 18px;
        }
        .panel {
            background: #fff;
            border: 1px solid var(--brand-border);
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 14px 34px rgba(16, 42, 67, 0.08);
            margin-bottom: 18px;
        }
        .search-row {
            display: grid;
            grid-template-columns: minmax(220px, 1fr) auto;
            gap: 12px;
            align-items: end;
        }
        label {
            display: block;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--brand-muted);
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            border: 1px solid var(--brand-border);
            border-radius: 16px;
            padding: 14px 16px;
            color: var(--brand-ink);
            font: inherit;
            font-size: 18px;
        }
        button {
            border: 0;
            border-radius: 16px;
            background: var(--brand-pnl-blue);
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-weight: 900;
            padding: 15px 24px;
        }
        button:disabled {
            opacity: 0.55;
            cursor: wait;
        }
        .status {
            margin-top: 14px;
            color: var(--brand-muted);
            font-weight: 700;
        }
        .status.error {
            color: #b21b18;
        }
        .results {
            display: grid;
            gap: 12px;
        }
        .contact-card {
            border: 1px solid var(--brand-border);
            border-radius: 16px;
            padding: 16px 18px;
            background: #fbfdff;
        }
        .contact-header {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: baseline;
        }
        .contact-name {
            margin: 0;
            font-size: 22px;
            font-weight: 900;
        }
        .contact-id {
            color: var(--brand-muted);
            font-size: 13px;
            font-weight: 800;
            white-space: nowrap;
        }
        .contact-meta {
            margin-top: 8px;
            color: var(--brand-muted);
        }
        .contact-actions {
            margin-top: 14px;
        }
        .secondary-button {
            background: #e8f7ed;
            color: var(--brand-pnl-green-dark);
            padding: 10px 16px;
            border-radius: 999px;
            font-size: 15px;
        }
        .invoice-area {
            margin-top: 16px;
        }
        .invoice-table-wrap {
            overflow: auto;
            border: 1px solid var(--brand-border);
            border-radius: 14px;
        }
        table {
            width: 100%;
            min-width: 980px;
            border-collapse: collapse;
            background: #fff;
        }
        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--brand-border);
            text-align: left;
            vertical-align: top;
        }
        th {
            color: var(--brand-muted);
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: #f6fafc;
        }
        .money {
            text-align: right;
            white-space: nowrap;
        }
        .pill {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            padding: 4px 9px;
            font-size: 12px;
            font-weight: 900;
            background: #eef4fb;
            color: #0b5870;
            white-space: nowrap;
        }
        .pill.paid {
            background: #dff5e8;
            color: #087a3d;
        }
        .pill.open {
            background: #fff2d7;
            color: #9a6100;
        }
        .pill.deleted,
        .pill.draft {
            background: #eceff3;
            color: #5b6775;
        }
        tr.informative-invoice {
            color: #6b7280;
            background: #f3f5f7;
        }
        tr.informative-invoice td {
            opacity: 0.76;
        }
        .invoice-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 0 0 10px;
        }
        .invoice-toolbar .status {
            margin: 0;
        }
        .download-button {
            background: #eef4fb;
            color: #0b5870;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 14px;
        }
        .raw-toggle {
            margin-top: 10px;
            display: inline-block;
            color: #0b5870;
            font-weight: 900;
            cursor: pointer;
            user-select: none;
        }
        pre {
            max-height: 260px;
            overflow: auto;
            background: #f4f8fb;
            border: 1px solid var(--brand-border);
            border-radius: 12px;
            padding: 12px;
            white-space: pre-wrap;
        }
        @media (max-width: 760px) {
            .topbar, .search-row, .contact-header {
                grid-template-columns: 1fr;
                flex-direction: column;
                align-items: stretch;
            }
            .search-row {
                display: block;
            }
            button {
                width: 100%;
                margin-top: 12px;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/utilities">
            <img src="/assets/brand/logo_pnl_evolution.png" alt="PNL Evolution">
            <span>
                <span class="brand-title">Rebekko Webapps</span>
                <span class="brand-subtitle">Utilities</span>
            </span>
        </a>
        <nav class="nav" aria-label="Navigazione principale">
            <a href="/">Home</a>
            <a href="/utilities">Utilities</a>
            <a href="/utilities/classroom-manager">Classroom Manager</a>
            <a class="active" href="/utilities/smallinvoice">Smallinvoice</a>
        </nav>
    </header>

    <main class="container">
        <section class="hero">
            <h1>Smallinvoice</h1>
            <p>Ricerca clienti per nome. Le credenziali API restano sul server: il browser chiama solo Rebekko.</p>
        </section>

        <section class="panel">
            <form id="search-form" class="search-row">
                <div>
                    <label for="query">Nome cliente</label>
                    <input id="query" name="query" autocomplete="off" placeholder="Es. Rossi, PNL, Mario" minlength="2" required>
                </div>
                <button id="search-button" type="submit">Cerca</button>
            </form>
            <div id="status" class="status">Inserisci almeno 2 caratteri e avvia la ricerca.</div>
        </section>

        <section class="panel">
            <div id="results" class="results"></div>
        </section>
    </main>

    <script>
        const form = document.getElementById('search-form');
        const queryInput = document.getElementById('query');
        const button = document.getElementById('search-button');
        const statusEl = document.getElementById('status');
        const resultsEl = document.getElementById('results');

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function contactName(contact) {
            return contact.display_name
                || contact.company_name
                || contact.company
                || [contact.first_name, contact.last_name].filter(Boolean).join(' ')
                || contact.name
                || `Cliente ${contact.id || ''}`.trim();
        }

        function contactMeta(contact) {
            const parts = [
                contact.email || contact.email_address,
                [contact.zip, contact.city].filter(Boolean).join(' '),
                contact.phone || contact.phone_number,
            ].filter(Boolean);
            return parts.length ? parts.join(' · ') : 'Nessun dettaglio sintetico disponibile.';
        }

        function formatDate(value) {
            if (!value) return '-';
            return String(value).slice(0, 10);
        }

        function formatMoney(value, currency) {
            if (value === null || value === undefined || value === '') return '-';
            const amount = Number(value);
            const rendered = Number.isFinite(amount) ? amount.toFixed(2) : String(value);
            return currency ? `${rendered} ${currency}` : rendered;
        }

        function invoiceStatusClass(invoice) {
            const status = String(invoice.status || '').toLowerCase();
            if (status === 'd' || status === 'deleted') {
                return 'deleted';
            }
            if (status === 'dr' || status === 'draft') {
                return 'draft';
            }
            if (status.includes('paid') || Number(invoice.total_paid || 0) >= Number(invoice.total || 1)) {
                return 'paid';
            }
            return 'open';
        }

        function invoiceStatus(invoice) {
            const status = String(invoice.status || '').trim();
            if (status.toLowerCase() === 'd') return 'Deleted';
            if (status.toLowerCase() === 'dr') return 'Draft';
            return status || (invoice.paid_date ? 'paid' : 'open');
        }

        function invoiceDateValue(invoice) {
            return invoice.date || invoice.created_at || invoice.due || invoice.paid_date || '';
        }

        function isInformativeInvoice(invoice) {
            const statusClass = invoiceStatusClass(invoice);
            return statusClass === 'deleted' || statusClass === 'draft';
        }

        function csvEscape(value) {
            const text = String(value ?? '');
            if (/[",;\n\r]/.test(text)) {
                return `"${text.replace(/"/g, '""')}"`;
            }
            return text;
        }

        function downloadCsv(filename, invoices) {
            const headers = [
                'number',
                'date',
                'due',
                'paid_date',
                'status',
                'total',
                'total_paid',
                'currency',
                'isr_reference_number',
                'id',
                'contact_id',
            ];
            const rows = invoices.map((invoice) => [
                invoice.number || '',
                formatDate(invoiceDateValue(invoice)),
                formatDate(invoice.due),
                formatDate(invoice.paid_date),
                invoiceStatus(invoice),
                invoice.total ?? '',
                invoice.total_paid ?? '',
                invoice.currency || '',
                invoice.isr_reference_number || invoice.reference || '',
                invoice.id || '',
                invoice.contact_id || '',
            ]);
            const csv = [headers, ...rows]
                .map((row) => row.map(csvEscape).join(';'))
                .join('\n');
            const blob = new Blob([`\uFEFF${csv}`], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(url);
        }

        function renderInvoices(target, invoices) {
            if (!invoices.length) {
                target.innerHTML = '<div class="status">Nessuna fattura trovata per questo cliente.</div>';
                return;
            }
            const rows = invoices.map((invoice, index) => `
                <tr class="${isInformativeInvoice(invoice) ? 'informative-invoice' : ''}">
                    <td>${escapeHtml(invoice.number || invoice.id || '-')}</td>
                    <td>${escapeHtml(formatDate(invoiceDateValue(invoice)))}</td>
                    <td>${escapeHtml(formatDate(invoice.due))}</td>
                    <td>${escapeHtml(formatDate(invoice.paid_date))}</td>
                    <td><span class="pill ${invoiceStatusClass(invoice)}">${escapeHtml(invoiceStatus(invoice))}</span></td>
                    <td class="money">${escapeHtml(formatMoney(invoice.total, invoice.currency))}</td>
                    <td class="money">${escapeHtml(formatMoney(invoice.total_paid, invoice.currency))}</td>
                    <td>${escapeHtml(invoice.isr_reference_number || invoice.reference || '-')}</td>
                    <td>
                        <details>
                            <summary class="raw-toggle">JSON</summary>
                            <pre>${escapeHtml(JSON.stringify(invoice, null, 2))}</pre>
                        </details>
                    </td>
                </tr>
            `).join('');
            target.innerHTML = `
                <div class="invoice-table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Numero</th>
                                <th>Data</th>
                                <th>Due date</th>
                                <th>Pagamento</th>
                                <th>Stato</th>
                                <th class="money">Totale</th>
                                <th class="money">Pagato</th>
                                <th>Riferimento</th>
                                <th>Dettaglio</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            `;
        }

        async function loadInvoices(contactId, index) {
            const area = document.getElementById(`invoices-${index}`);
            const actionButton = document.getElementById(`invoice-button-${index}`);
            if (!contactId || !area || !actionButton) return;

            actionButton.disabled = true;
            area.innerHTML = '<div class="status">Carico fatture...</div>';
            try {
                const response = await fetch(`/api/utilities/smallinvoice/contacts/${encodeURIComponent(contactId)}/invoices`);
                const payload = await response.json();
                if (!response.ok) {
                    throw new Error(payload.detail || 'Recupero fatture fallito.');
                }
                const invoices = payload.invoices || [];
                const safeContactId = String(payload.contact_id || contactId).replace(/[^a-zA-Z0-9_-]/g, '_');
                area.innerHTML = `
                    <div class="invoice-toolbar">
                        <div class="status">${payload.count} fatture trovate.</div>
                        <button class="download-button" type="button">Scarica CSV</button>
                    </div>
                `;
                area.querySelector('.download-button').addEventListener('click', () => {
                    downloadCsv(`smallinvoice-fatture-${safeContactId}.csv`, invoices);
                });
                const tableHost = document.createElement('div');
                area.appendChild(tableHost);
                renderInvoices(tableHost, invoices);
            } catch (error) {
                area.innerHTML = `<div class="status error">${escapeHtml(error.message || 'Recupero fatture fallito.')}</div>`;
            } finally {
                actionButton.disabled = false;
            }
        }

        function renderResults(contacts) {
            if (!contacts.length) {
                resultsEl.innerHTML = '<div class="contact-card">Nessun cliente trovato.</div>';
                return;
            }
            resultsEl.innerHTML = contacts.map((contact, index) => {
                const rawId = `raw-${index}`;
                return `
                    <article class="contact-card">
                        <div class="contact-header">
                            <h2 class="contact-name">${escapeHtml(contactName(contact))}</h2>
                            <span class="contact-id">ID ${escapeHtml(contact.id || '-')}</span>
                        </div>
                        <div class="contact-meta">${escapeHtml(contactMeta(contact))}</div>
                        <div class="contact-actions">
                            <button
                                id="invoice-button-${index}"
                                class="secondary-button"
                                type="button"
                                onclick="loadInvoices('${escapeHtml(contact.id || '')}', ${index})"
                            >Fatture</button>
                        </div>
                        <div id="invoices-${index}" class="invoice-area"></div>
                        <details>
                            <summary class="raw-toggle">Dettaglio tecnico</summary>
                            <pre id="${rawId}">${escapeHtml(JSON.stringify(contact, null, 2))}</pre>
                        </details>
                    </article>
                `;
            }).join('');
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const query = queryInput.value.trim();
            if (query.length < 2) {
                statusEl.textContent = 'Inserisci almeno 2 caratteri.';
                statusEl.classList.add('error');
                return;
            }

            button.disabled = true;
            statusEl.classList.remove('error');
            statusEl.textContent = 'Ricerca in corso...';
            resultsEl.innerHTML = '';

            try {
                const response = await fetch(`/api/utilities/smallinvoice/contacts?query=${encodeURIComponent(query)}`);
                const payload = await response.json();
                if (!response.ok) {
                    throw new Error(payload.detail || 'Ricerca fallita.');
                }
                statusEl.textContent = `${payload.count} clienti trovati per "${payload.query}".`;
                renderResults(payload.contacts || []);
            } catch (error) {
                statusEl.textContent = error.message || 'Ricerca fallita.';
                statusEl.classList.add('error');
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
